name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first and without node_modules. A conformance gate that only works in a
  # fully installed environment is one that gets skipped.
  corpus:
    name: Contract corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every contract method has a fixture
        run: node scripts/check-corpus.mjs

  # Everything else in this workflow reads the SOURCE tree, where every file it
  # needs is present. Only `npm pack` sees what a consumer downloads. `main`
  # pointed at lib/commonjs/index.js while the build produced only lib/module/,
  # and nothing caught it — it would have surfaced as "module not found" in
  # someone else's app after publishing.
  pack:
    name: Publishable artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-pack.mjs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  # Coverage says a line ran. Mutation says an assertion would have noticed if
  # it changed. This suite scored 77.67% on its first mutation run while sitting
  # at 99% statement coverage — every surviving mutant was on a line the tests
  # already executed, so coverage could not see any of them.
  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stryker
        # The threshold break is in stryker.conf.json at 95, set after measuring.
        # Two mutants are equivalent and documented there; the ceiling is ~99.
        run: npx stryker run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/

  # The Swift bridge is compiled by nothing until someone runs pod install in a
  # host app. This resolves every Intempt symbol it uses against a real SDK
  # build, which is where the one shipped bug in that file lived
  # (Intempt.initialize, which is a static on IntemptInstance).
  #
  # It does NOT verify @objc export shape, the RCT_EXTERN_METHOD declarations,
  # autolinking or codegen — see ios-build.
  ios-typecheck:
    name: iOS typecheck (against real Intempt)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check out intempt-swift at the pinned tag
        uses: actions/checkout@v4
        with:
          repository: intempt/intempt-swift
          ref: v0.1.0
          path: intempt-swift
      - name: Typecheck the bridge
        run: ./scripts/typecheck-ios.sh "$GITHUB_WORKSPACE/intempt-swift"

  # The real integration check: a bare React Native app that consumes this
  # package, resolves the podspec, autolinks it, runs codegen and compiles the
  # Objective-C++ bridge. Everything ios-typecheck cannot see.
  #
  # Builds for a generic iOS destination — no simulator runtime needed, and
  # compiling is where the value is. Running would additionally prove an event
  # reaches Intempt, which the Swift SDK's own live contract tests already cover.
  ios-build:
    name: iOS build (bare RN host app)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: intempt-react-native
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scaffold a bare React Native app
        run: |
          npx --yes @react-native-community/cli@latest init HostApp \
            --version 0.81.0 --skip-install --install-pods false
      - name: Link the package from source
        working-directory: HostApp
        run: |
          npm install
          npm install ../intempt-react-native
      - name: Add the Intempt pod from git
        working-directory: HostApp/ios
        run: |
          # Not on CocoaPods trunk yet; the repository is public so a tagged
          # git reference resolves without credentials. Remove this once
          # `pod trunk push` has run — see issue #2.
          printf "\npod 'Intempt', :git => 'https://github.com/intempt/intempt-swift.git', :tag => 'v0.1.0'\n" \
            >> Podfile
          pod install
      - name: Compile
        working-directory: HostApp/ios
        run: |
          xcodebuild -workspace HostApp.xcworkspace -scheme HostApp \
            -configuration Debug -destination 'generic/platform=iOS' \
            -quiet build CODE_SIGNING_ALLOWED=NO

  # 505 lines of Kotlin that no compiler saw until 2026-08-15.
  #
  # Builds it the way it is actually consumed — inside a bare React Native host
  # app, so autolinking is exercised too. An earlier version of this job ran
  # `./gradlew` inside android/ and failed with "No such file or directory":
  # the module is a library built by the consuming app and ships no wrapper,
  # which is correct. Building it standalone would have tested a shape no
  # integrator ever uses.
  #
  # intempt-android 3.0.1 is published on Maven Central (2026-08-16), so this
  # resolves it for real — no local publish/mavenLocal workaround needed.
  android-build:
    name: Android build (bare RN host app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: intempt-react-native
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Scaffold a bare React Native app
        run: |
          npx --yes @react-native-community/cli@latest init HostApp \
            --version 0.81.0 --skip-install --install-pods false --pm npm
      - name: Link the package from source
        working-directory: HostApp
        run: |
          npm install
          npm install ../intempt-react-native
      - name: Build
        working-directory: HostApp/android
        run: ./gradlew assembleDebug --no-daemon

  # Typechecks the committed example app against the package it consumes, so a
  # breaking API change fails here rather than in a customer's editor.
  example-typecheck:
    name: Example app typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The example resolves the package through `file:..`, and package.json's
      # `types` points at lib/typescript — which does not exist until the
      # package is built. Without this the example cannot see its own dependency.
      - name: Build the package it consumes
        run: |
          npm ci
          npm run build
      - name: Install and typecheck
        working-directory: example
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit

  # The only check that runs the whole stack: JavaScript -> TurboModule ->
  # native SDK -> HTTP -> api.intempt.com, on a booted simulator. Everything
  # else in this workflow stops at a boundary.
  #
  # Asserts on flush(), which resolves to events the SERVER accepted. track()
  # returning true only means the queue took it, and a transport posting with no
  # Authorization header produces correct payloads while delivering nothing —
  # that bug shipped in intempt-android and lost 100% of events.
  #
  # Skips itself when the INTEMPT_* secrets are absent, matching intempt-swift's
  # live contract tests, so a fork still gets a green suite.
  e2e-ios:
    name: E2E (simulator, live API)
    runs-on: macos-15
    # Blocking again as of the Expo example app.
    #
    # It was non-blocking while the probe reported through console.log, which
    # does not reach os_log in a `--dev false` bundle — CI captured nothing while
    # the app ran perfectly (issue #6). The committed example can depend on
    # expo-file-system, so it writes a file and the harness reads it with
    # `simctl get_app_container`. No streaming, no race.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the probe app against api.intempt.com
        env:
          # EXPO_PUBLIC_ prefix: Expo inlines these at build time, which is how
          # they reach a release bundle at all.
          EXPO_PUBLIC_INTEMPT_E2E: '1'
          EXPO_PUBLIC_INTEMPT_API_KEY: ${{ secrets.INTEMPT_API_KEY }}
          EXPO_PUBLIC_INTEMPT_ORG_ID: ${{ secrets.INTEMPT_ORG_ID }}
          EXPO_PUBLIC_INTEMPT_PROJECT_ID: ${{ secrets.INTEMPT_PROJECT_ID }}
          EXPO_PUBLIC_INTEMPT_SOURCE_ID: ${{ secrets.INTEMPT_SOURCE_ID }}
        run: ./scripts/run-e2e-ios.sh "$RUNNER_TEMP/e2e"
