name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first and without node_modules. A conformance gate that only works in a
  # fully installed environment is one that gets skipped.
  corpus:
    name: Contract corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check every contract method has a fixture
        run: node scripts/check-corpus.mjs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  # The Swift bridge is compiled by nothing until someone runs pod install in a
  # host app. This resolves every Intempt symbol it uses against a real SDK
  # build, which is where the one shipped bug in that file lived
  # (Intempt.initialize, which is a static on IntemptInstance).
  #
  # It does NOT verify @objc export shape, the RCT_EXTERN_METHOD declarations,
  # autolinking or codegen — see ios-build.
  ios-typecheck:
    name: iOS typecheck (against real Intempt)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check out intempt-swift at the pinned tag
        uses: actions/checkout@v4
        with:
          repository: intempt/intempt-swift
          ref: v0.1.0
          path: intempt-swift
      - name: Typecheck the bridge
        run: ./scripts/typecheck-ios.sh "$GITHUB_WORKSPACE/intempt-swift"

  # The real integration check: a bare React Native app that consumes this
  # package, resolves the podspec, autolinks it, runs codegen and compiles the
  # Objective-C++ bridge. Everything ios-typecheck cannot see.
  #
  # Builds for a generic iOS destination — no simulator runtime needed, and
  # compiling is where the value is. Running would additionally prove an event
  # reaches Intempt, which the Swift SDK's own live contract tests already cover.
  ios-build:
    name: iOS build (bare RN host app)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: intempt-react-native
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scaffold a bare React Native app
        run: |
          npx --yes @react-native-community/cli@latest init HostApp \
            --version 0.81.0 --skip-install --install-pods false
      - name: Link the package from source
        working-directory: HostApp
        run: |
          npm install
          npm install ../intempt-react-native
      - name: Add the Intempt pod from git
        working-directory: HostApp/ios
        run: |
          # Not on CocoaPods trunk yet; the repository is public so a tagged
          # git reference resolves without credentials. Remove this once
          # `pod trunk push` has run — see issue #2.
          printf "\npod 'Intempt', :git => 'https://github.com/intempt/intempt-swift.git', :tag => 'v0.1.0'\n" \
            >> Podfile
          pod install
      - name: Compile
        working-directory: HostApp/ios
        run: |
          xcodebuild -workspace HostApp.xcworkspace -scheme HostApp \
            -configuration Debug -destination 'generic/platform=iOS' \
            -quiet build CODE_SIGNING_ALLOWED=NO

  # 505 lines of Kotlin that no compiler saw until 2026-08-15.
  #
  # Builds it the way it is actually consumed — inside a bare React Native host
  # app, so autolinking is exercised too. An earlier version of this job ran
  # `./gradlew` inside android/ and failed with "No such file or directory":
  # the module is a library built by the consuming app and ships no wrapper,
  # which is correct. Building it standalone would have tested a shape no
  # integrator ever uses.
  #
  # PINNED TO A LOCAL BUILD ON PURPOSE. intempt-android 3.0.0 is not on Maven
  # Central — 2.0.1 is latest and is unusable (minSdk 31, kotlinx-serialization
  # scoped as `implementation`). Publishing the SDK into the runner's ~/.m2 is
  # what makes this job possible before 3.0 ships. Once it publishes: drop the
  # publish step, drop mavenLocal, drop -PintemptAndroidVersion.
  android-build:
    name: Android build (bare RN host app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: intempt-react-native
      - uses: actions/checkout@v4
        with:
          repository: intempt/intempt-android
          ref: feature/inherit-mixpanel-substrate
          path: intempt-android
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Publish the SDK to the runner's local Maven repo
        working-directory: intempt-android
        run: ./gradlew publishToMavenLocal -PVERSION=3.0.0-LOCAL -PSKIP_SIGNING=true --no-daemon
      - name: Confirm the artifact actually landed in ~/.m2
        run: |
          # Distinguishes "publish failed" from "published but unresolvable".
          # Without this, both look identical at the build step.
          ls -la ~/.m2/repository/com/intempt/sdk/intempt-android/3.0.0-LOCAL/
      - name: Scaffold a bare React Native app
        run: |
          npx --yes @react-native-community/cli@latest init HostApp \
            --version 0.81.0 --skip-install --install-pods false --pm npm
      - name: Link the package from source
        working-directory: HostApp
        run: |
          npm install
          npm install ../intempt-react-native
      - name: Point the app at the locally-published SDK
        working-directory: HostApp/android
        run: |
          # The RN 0.81 template's settings.gradle has NO repositories block —
          # com.facebook.react.settings owns dependency resolution, so editing
          # settings.gradle or adding allprojects{repositories} does nothing.
          # An init script is the one place that can inject a repository
          # regardless of how the build configures resolution — and it has to
          # hook settingsEvaluated, not beforeSettings: the React Native
          # settings plugin configures dependencyResolutionManagement itself,
          # so anything added before it is applied gets replaced.
          cat > init.gradle <<'INIT'
          settingsEvaluated { settings ->
            settings.dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { mavenLocal() }
            }
          }
          INIT
          echo "intemptAndroidVersion=3.0.0-LOCAL" >> gradle.properties
      - name: Build
        working-directory: HostApp/android
        run: ./gradlew assembleDebug --no-daemon --init-script init.gradle
